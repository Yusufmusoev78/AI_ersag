<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Office AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --bg-soft: #161925;
    --panel: #1b1f2e;
    --panel-2: #21263a;
    --border: #2a2f42;
    --text: #e7e9f0;
    --text-dim: #9195a8;
    --accent: #7c8cff;
    --accent-2: #a685ff;
    --accent-grad: linear-gradient(135deg, #7c8cff 0%, #a685ff 100%);
    --success: #4ade80;
    --error: #ff6b6b;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar ---------- */
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 22px;
    background: linear-gradient(180deg, var(--bg-soft), var(--bg));
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #logo {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--accent-grad);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    box-shadow: 0 4px 14px rgba(124,140,255,0.4);
  }
  #title-block { display: flex; flex-direction: column; line-height: 1.15; }
  #title-block .name { font-weight: 700; font-size: 15px; letter-spacing: 0.2px; }
  #title-block .sub { font-size: 11.5px; color: var(--text-dim); }
  #status-pill {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
  }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    transition: background .2s, box-shadow .2s;
  }
  #status-dot.busy { background: #facc15; box-shadow: 0 0 8px #facc15; animation: pulse 1s infinite; }
  #status-dot.down { background: var(--error); box-shadow: 0 0 8px var(--error); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ---------- Layout ---------- */
  #main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--bg-soft);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px 12px;
  }
  #new-chat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  #new-chat-btn:hover { background: var(--panel-2); border-color: var(--accent); }

  .side-section-label {
    margin: 18px 6px 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  #chat-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #chat-list::-webkit-scrollbar { width: 6px; }
  #chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background .12s, color .12s;
  }
  .chat-item .dot { flex-shrink: 0; font-size: 8px; color: var(--accent); }
  .chat-item:hover { background: var(--panel); color: var(--text); }
  .chat-item.active { background: var(--panel-2); color: var(--text); }
  #chat-empty { padding: 10px; font-size: 12px; color: var(--text-dim); }

  #sidebar-footer {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px;
    margin-top: 8px;
    border-top: 1px solid var(--border);
  }
  #sidebar-footer .avatar-sm {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent-grad);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #10122a;
    flex-shrink: 0;
  }
  #sidebar-footer .label { font-size: 12.5px; color: var(--text-dim); }

  #chat-col {
    flex: 1;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 18px 22px;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 6px 4px 12px;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .row { display: flex; gap: 10px; max-width: 78%; animation: rise .25s ease-out; }
  .row.you { align-self: flex-end; flex-direction: row-reverse; }
  .row.assistant, .row.system, .row.error { align-self: flex-start; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .avatar {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .row.you .avatar { background: var(--accent-grad); }
  .row.assistant .avatar { background: var(--panel-2); border: 1px solid var(--border); }
  .row.system .avatar, .row.error .avatar { background: var(--panel-2); border: 1px solid var(--border); }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.you .bubble { background: var(--accent-grad); color: #10122a; border-bottom-right-radius: 4px; font-weight: 500; }
  .row.assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .row.system .bubble { background: transparent; border: 1px dashed var(--border); color: var(--text-dim); font-size: 12.5px; }
  .row.error .bubble { background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.35); color: var(--error); }

  /* ---------- Code blocks ---------- */
  .code-block {
    margin: 8px 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0b0d13;
  }
  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: var(--panel-2);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
  .copy-btn {
    display: flex; align-items: center; gap: 5px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: color .12s, border-color .12s;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .copy-btn svg { width: 12px; height: 12px; }
  .code-block pre {
    margin: 0;
    padding: 12px 14px;
    overflow-x: auto;
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    line-height: 1.55;
    color: #d7dae4;
  }

  /* ---------- Attachment chip ---------- */
  .attachment-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 10px;
  }
  .attachment-chip .file-icon { font-size: 18px; }
  .attachment-chip .file-meta { display: flex; flex-direction: column; line-height: 1.25; }
  .attachment-chip .file-name { font-size: 13px; font-weight: 600; }
  .attachment-chip .file-note { font-size: 11px; opacity: 0.75; }

  /* ---------- Pending attachments (staged before send) ---------- */
  #pending-attachments {
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  #pending-attachments.has-items { display: flex; }
  .pending-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 8px 7px 12px;
  }
  .pending-chip .file-icon { font-size: 16px; }
  .pending-chip .file-name {
    font-size: 12.5px;
    font-weight: 500;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pending-chip .remove-btn {
    display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px;
    border: none;
    border-radius: 50%;
    background: var(--panel-2);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .pending-chip .remove-btn:hover { color: var(--error); }

  .typing-dots { display: inline-flex; gap: 4px; align-items: center; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* ---------- Input ---------- */
  #input-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px 6px 6px 16px;
    transition: border-color .15s;
  }
  #input-row:focus-within { border-color: var(--accent); }
  #input-box {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 0;
  }
  #input-box::placeholder { color: var(--text-dim); }
  #send-btn {
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px;
    border: none;
    border-radius: 10px;
    background: var(--accent-grad);
    color: #10122a;
    cursor: pointer;
    transition: transform .12s, opacity .12s;
  }
  #send-btn:hover:not(:disabled) { transform: scale(1.05); }
  #send-btn:disabled { opacity: 0.4; cursor: default; }
  #send-btn svg { width: 18px; height: 18px; }

  #attach-btn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px;
    flex-shrink: 0;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  #attach-btn:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
  #attach-btn:disabled { opacity: 0.4; cursor: default; }
  #attach-btn svg { width: 17px; height: 17px; }

</style>
</head>
<body>
  <div id="topbar">
    <div id="logo">📎</div>
    <div id="title-block">
      <span class="name">Office AI Assistant</span>
      <span class="sub">Word &amp; Excel, handled for you</span>
    </div>
    <div id="status-pill"><span id="status-dot"></span><span id="status-text">Connecting…</span></div>
  </div>

  <div id="main">
    <div id="sidebar">
      <button id="new-chat-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <div class="side-section-label">Chats</div>
      <div id="chat-list"></div>
      <div id="sidebar-footer">
        <div class="avatar-sm">A</div>
        <span class="label">Local session</span>
      </div>
    </div>
    <div id="chat-col">
      <div id="log"></div>
      <div id="pending-attachments"></div>
      <div id="input-row">
        <button id="attach-btn" title="Attach a file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input id="file-input" type="file" style="display:none" />
        <input id="input-box" type="text" placeholder="Ask me to create, read, edit, or open a Word/Excel file…" autocomplete="off" />
        <button id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>

<script>
const log = document.getElementById("log");
const inputBox = document.getElementById("input-box");
const sendBtn = document.getElementById("send-btn");
const statusDot = document.getElementById("status-dot");
const statusText = document.getElementById("status-text");
const chatList = document.getElementById("chat-list");
const newChatBtn = document.getElementById("new-chat-btn");
const attachBtn = document.getElementById("attach-btn");
const fileInput = document.getElementById("file-input");

const AVATARS = { you: "🧑", assistant: "🤖", system: "✨", error: "⚠️" };
const FILE_ICONS = { ".docx": "📄", ".xlsx": "📊" };

let currentConversationId = null;   // the live, writable conversation
let viewingConversationId = null;   // whatever is currently rendered in the log
let viewingHistory = false;

const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>';

function renderMessageContent(bubble, text) {
  bubble.innerHTML = "";
  const fenceRe = /```(\w*)\n?([\s\S]*?)```/g;
  let lastIndex = 0;
  let match;
  let any = false;
  while ((match = fenceRe.exec(text)) !== null) {
    any = true;
    if (match.index > lastIndex) {
      const span = document.createElement("span");
      span.textContent = text.slice(lastIndex, match.index);
      bubble.appendChild(span);
    }
    bubble.appendChild(buildCodeBlock(match[1] || "text", match[2].replace(/\n$/, "")));
    lastIndex = fenceRe.lastIndex;
  }
  if (!any) {
    bubble.textContent = text;
    return;
  }
  if (lastIndex < text.length) {
    const span = document.createElement("span");
    span.textContent = text.slice(lastIndex);
    bubble.appendChild(span);
  }
}

function buildCodeBlock(lang, code) {
  const block = document.createElement("div");
  block.className = "code-block";
  const head = document.createElement("div");
  head.className = "code-head";
  const langLabel = document.createElement("span");
  langLabel.textContent = lang;
  const copyBtn = document.createElement("button");
  copyBtn.className = "copy-btn";
  copyBtn.innerHTML = COPY_ICON + "<span>Copy</span>";
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(code);
      copyBtn.innerHTML = CHECK_ICON + "<span>Copied</span>";
      setTimeout(() => { copyBtn.innerHTML = COPY_ICON + "<span>Copy</span>"; }, 1500);
    } catch (e) {
      copyBtn.innerHTML = "<span>Failed</span>";
    }
  });
  head.appendChild(langLabel);
  head.appendChild(copyBtn);
  const pre = document.createElement("pre");
  const codeEl = document.createElement("code");
  codeEl.textContent = code;
  pre.appendChild(codeEl);
  block.appendChild(head);
  block.appendChild(pre);
  return block;
}

function appendMessage(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = AVATARS[role] || "•";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  renderMessageContent(bubble, text);
  row.appendChild(avatar);
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "row assistant";
  row.id = "typing-row";
  row.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>`;
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function hideTyping() {
  const row = document.getElementById("typing-row");
  if (row) row.remove();
}

function setStatus(state, text) {
  statusDot.className = state;
  statusText.textContent = text;
}

function clearLog() {
  log.innerHTML = "";
}

function setReadOnly(readOnly) {
  viewingHistory = readOnly;
  inputBox.disabled = readOnly;
  sendBtn.disabled = readOnly;
  attachBtn.disabled = readOnly;
  inputBox.placeholder = readOnly
    ? "Viewing past conversation — click a chat's ⟲ or New chat to continue"
    : "Ask me to create, read, edit, or open a Word/Excel file…";
}

async function loadConversations() {
  try {
    const res = await fetch("/conversations");
    const items = await res.json();
    chatList.innerHTML = "";
    if (!items.length) {
      chatList.innerHTML = '<div id="chat-empty">No chats yet.</div>';
      return;
    }
    for (const item of items) {
      const div = document.createElement("div");
      div.className = "chat-item" + (item.id === viewingConversationId ? " active" : "");
      div.innerHTML = `<span class="dot">●</span><span>${(item.title || "New chat").replace(/</g, "&lt;")}</span>`;
      div.addEventListener("click", () => openConversation(item.id));
      chatList.appendChild(div);
    }
  } catch (e) {
    // ignore transient errors
  }
}

async function openConversation(id) {
  pendingAttachments = [];
  renderPendingAttachments();
  if (id === currentConversationId) {
    // Returning to the live conversation: reload its saved transcript, but keep it writable.
    await renderConversation(id);
    setReadOnly(false);
    viewingConversationId = id;
    loadConversations();
    return;
  }
  await renderConversation(id);
  setReadOnly(true);
  viewingConversationId = id;
  loadConversations();
}

async function renderConversation(id) {
  clearLog();
  try {
    const res = await fetch(`/conversations/${id}/messages`);
    const messages = await res.json();
    if (!messages.length) {
      appendMessage("system", "This conversation is empty.");
      return;
    }
    for (const m of messages) {
      const role = m.role === "user" ? "you" : "assistant";
      appendMessage(role, m.content);
    }
  } catch (e) {
    appendMessage("error", "Could not load this conversation.");
  }
}

async function startNewChat() {
  try {
    const res = await fetch("/conversations/new", { method: "POST" });
    const data = await res.json();
    currentConversationId = data.conversation_id;
    viewingConversationId = data.conversation_id;
    pendingAttachments = [];
    renderPendingAttachments();
    clearLog();
    setReadOnly(false);
    appendMessage("system", "New chat started. Ask me to create, read, edit, or open a Word/Excel file.");
    loadConversations();
    inputBox.focus();
  } catch (e) {
    appendMessage("error", "Could not start a new chat.");
  }
}

async function sendToBackend(backendText) {
  sendBtn.disabled = true;
  attachBtn.disabled = true;
  setStatus("busy", "Thinking…");
  showTyping();
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: backendText }),
    });
    hideTyping();
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      appendMessage("error", err.detail || "Request failed");
    } else {
      const data = await res.json();
      appendMessage("assistant", data.reply);
      loadConversations();
    }
  } catch (e) {
    hideTyping();
    appendMessage("error", String(e));
  } finally {
    sendBtn.disabled = false;
    attachBtn.disabled = false;
    setStatus("", "Online");
    inputBox.focus();
  }
}

let pendingAttachments = [];   // files staged but not sent yet, like Claude's compose area

function fileIcon(filename) {
  const ext = "." + (filename.split(".").pop() || "").toLowerCase();
  return FILE_ICONS[ext] || "📎";
}

function renderPendingAttachments() {
  const container = document.getElementById("pending-attachments");
  container.innerHTML = "";
  container.classList.toggle("has-items", pendingAttachments.length > 0);
  pendingAttachments.forEach((att, idx) => {
    const chip = document.createElement("div");
    chip.className = "pending-chip";
    chip.innerHTML = `<span class="file-icon">${fileIcon(att.filename)}</span>` +
      `<span class="file-name">${att.filename}</span>` +
      `<button class="remove-btn" title="Remove">✕</button>`;
    chip.querySelector(".remove-btn").addEventListener("click", () => {
      pendingAttachments.splice(idx, 1);
      renderPendingAttachments();
    });
    container.appendChild(chip);
  });
}

function appendUserMessage(text, attachments) {
  const row = document.createElement("div");
  row.className = "row you";
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = AVATARS.you;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  (attachments || []).forEach((att) => {
    const chip = document.createElement("div");
    chip.className = "attachment-chip";
    chip.innerHTML = `<span class="file-icon">${fileIcon(att.filename)}</span>` +
      `<span class="file-meta"><span class="file-name">${att.filename}</span>` +
      `<span class="file-note">Attached</span></span>`;
    bubble.appendChild(chip);
  });
  if (text) {
    const textSpan = document.createElement("span");
    textSpan.textContent = text;
    if ((attachments || []).length) textSpan.style.marginTop = "6px";
    bubble.appendChild(textSpan);
  }
  row.appendChild(avatar);
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function buildBackendText(text, attachments) {
  if (!attachments.length) return text;
  const fileLines = attachments
    .map((a) => `- "${a.filename}" at path: ${a.path}`)
    .join("\n");
  const filesBlock = `Attached file(s):\n${fileLines}`;
  return text
    ? `${text}\n\n${filesBlock}`
    : `Please look at the attached file(s) and tell me what they contain, or help me with them.\n\n${filesBlock}`;
}

async function sendMessage() {
  if (viewingHistory) return;
  const text = inputBox.value.trim();
  if (!text && pendingAttachments.length === 0) return;
  inputBox.value = "";
  const attachments = pendingAttachments;
  pendingAttachments = [];
  renderPendingAttachments();
  appendUserMessage(text, attachments);
  await sendToBackend(buildBackendText(text, attachments));
}

async function uploadFile(file) {
  const formData = new FormData();
  formData.append("file", file);
  attachBtn.disabled = true;
  try {
    const res = await fetch("/upload", { method: "POST", body: formData });
    if (!res.ok) {
      appendMessage("error", "Upload failed.");
      return;
    }
    const data = await res.json();
    if (!data.supported) {
      appendMessage("system", `"${data.filename}" isn't a supported file type yet — I can work with .docx, .xlsx, and text files (.txt, .csv, .md, .json, .py, .js, .html, .css, .log).`);
      return;
    }
    pendingAttachments.push(data);
    renderPendingAttachments();
    inputBox.focus();
  } catch (e) {
    appendMessage("error", String(e));
  } finally {
    attachBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", sendMessage);
inputBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});
newChatBtn.addEventListener("click", startNewChat);
attachBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  if (fileInput.files && fileInput.files[0]) {
    uploadFile(fileInput.files[0]);
    fileInput.value = "";
  }
});

async function checkHealth() {
  try {
    const res = await fetch("/health");
    if (res.ok) {
      setStatus("", "Online");
      return;
    }
  } catch (e) {}
  setStatus("down", "Offline");
}

async function init() {
  checkHealth();
  try {
    const res = await fetch("/session");
    const data = await res.json();
    currentConversationId = data.conversation_id;
    viewingConversationId = data.conversation_id;
  } catch (e) {
    // backend not reachable yet; conversation list/new-chat will still work once it is
  }
  appendMessage("system", "Ready. Ask me to create, read, edit, or open a Word/Excel file.");
  loadConversations();
  inputBox.focus();
}

init();
</script>
